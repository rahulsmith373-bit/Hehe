<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A6FB" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#electricGrad)" stroke-width="8" stroke-dasharray="12 8" opacity="0.4" />

  <!-- Main Clock / Duty dial background -->
  <circle cx="256" cy="256" r="150" fill="#111B34" stroke="url(#electricGrad)" stroke-width="6" />

  <!-- 12-hour tick marks -->
  <line x1="256" y1="126" x2="256" y2="142" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="370" x2="256" y2="386" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
  <line x1="126" y1="256" x2="142" y2="256" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
  <line x1="370" y1="256" x2="386" y2="256" stroke="#64748B" stroke-width="4" stroke-linecap="round" />

  <!-- Overtime Progress Arc (Orange/Amber to Blue) -->
  <path d="M 256 126 A 130 130 0 1 1 164 348" fill="none" stroke="url(#electricGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Overtime Badge Highlight Arc -->
  <path d="M 164 348 A 130 130 0 0 1 126 256" fill="none" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" />

  <!-- Clock hands showing shift duty -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="256" x2="340" y2="256" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" />
  
  <!-- Center cap -->
  <circle cx="256" cy="256" r="16" fill="url(#electricGrad)" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="256" cy="256" r="6" fill="#FFFFFF" />

  <!-- Mini technician wrench / badge indicator in corner -->
  <g transform="translate(320, 310) scale(0.65)">
    <circle cx="70" cy="70" r="65" fill="#0284C7" stroke="#38BDF8" stroke-width="6" />
    <path d="M 45 95 L 90 50 M 80 40 L 98 58" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 52 88 L 40 100" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
